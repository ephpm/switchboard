[package]
name = "switchboard"
version = "0.2.0"
edition = "2024"
# 1.88: the daemon uses let-chains (`if let … && …`), stabilized in 1.88.
rust-version = "1.88"
license = "MIT"
description = "Preview-deployment daemon for ePHPm — consumes switchboard-api job files, provisions previews, reports to GitHub"

[[bin]]
name = "switchboard"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }

# HTTP client (GitHub Deployments API + preview health polling)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML (ephpm.yaml app manifest + switchboard secrets file). serde_yml is the
# actively-maintained fork of the archived serde_yaml — chosen to avoid the
# RUSTSEC-2024-0320 "unmaintained" advisory.
serde_yml = "0.0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# JWT base64url (GitHub App auth)
base64 = "0.22"

# GIT_ASKPASS helper script lives in a private temp file for the daemon's
# lifetime (the installation token is passed to git via env, never argv/disk).
tempfile = "3"

[dev-dependencies]
tempfile = "3"
# Test-only: the preview-label cross-implementation guard (identity hash) that
# pins switchboard-api's PreviewLabel port to the Rust algorithm.
sha2 = "0.10"
hex = "0.4"

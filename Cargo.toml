[package]
name = "switchboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Preview-deployment daemon for ePHPm — consumes job files, kicks drain, provisions previews"

[dependencies]
# HTTP server (the legacy webhook receiver, off by default)
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# HTTP client (GitHub API)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML (ephpm.yaml app manifest + switchboard secrets file). serde_yml is the
# actively-maintained fork of the archived serde_yaml — chosen to avoid the
# RUSTSEC-2024-0320 "unmaintained" advisory if switchboard is open-sourced.
serde_yml = "0.0.12"

# Crypto (webhook signature verification, HS256 share-token minting,
# per-site KV password derivation)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# CSPRNG for the share token's `jti` (a fresh, unguessable revocation id per
# link). Already in the tree via rustls/ring — no new download.
getrandom = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
